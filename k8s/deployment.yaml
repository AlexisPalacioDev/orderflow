apiVersion: apps/v1
kind: Deployment
metadata:
  name: orders-api
  labels:
    app: orders-api
    app.kubernetes.io/part-of: orderflow
spec:
  replicas: 2
  selector:
    matchLabels:
      app: orders-api
  template:
    metadata:
      labels:
        app: orders-api
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1654
        runAsGroup: 1654
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: orders-api
          image: ghcr.io/example/orderflow-orders-api:1.0.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          env:
            - name: ASPNETCORE_URLS
              valueFrom:
                configMapKeyRef:
                  name: orderflow-config
                  key: ASPNETCORE_URLS
            - name: RABBITMQ_HOST
              valueFrom:
                configMapKeyRef:
                  name: orderflow-config
                  key: RABBITMQ_HOST
            - name: RABBITMQ_PORT
              valueFrom:
                configMapKeyRef:
                  name: orderflow-config
                  key: RABBITMQ_PORT
            - name: OUTBOX_POLL_MS
              valueFrom:
                configMapKeyRef:
                  name: orderflow-config
                  key: OUTBOX_POLL_MS
            - name: SEED_PATH
              valueFrom:
                configMapKeyRef:
                  name: orderflow-config
                  key: SEED_PATH
            - name: ConnectionStrings__OrdersDb
              valueFrom:
                secretKeyRef:
                  name: orderflow-secrets
                  key: ConnectionStrings__OrdersDb
            - name: RABBITMQ_USER
              valueFrom:
                secretKeyRef:
                  name: orderflow-secrets
                  key: RABBITMQ_USER
            - name: RABBITMQ_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: orderflow-secrets
                  key: RABBITMQ_PASSWORD
          livenessProbe:
            httpGet:
              path: /health/live
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health/ready
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
