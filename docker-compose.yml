services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-orderflow}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-orderflow}
      POSTGRES_DB: postgres
      POSTGRES_ORDERS_DB: ${POSTGRES_ORDERS_DB:-orders}
      POSTGRES_INVENTORY_DB: ${POSTGRES_INVENTORY_DB:-inventory}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infra/postgres/init-databases.sh:/docker-entrypoint-initdb.d/init-databases.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-orderflow} -d postgres"]
      interval: 5s
      timeout: 3s
      retries: 10

  rabbitmq:
    image: rabbitmq:3-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-orderflow}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-orderflow}
    ports:
      - "${RABBIT_UI_PORT:-15672}:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 12

  orders-api:
    build:
      context: .
      dockerfile: src/Orders.Api/Dockerfile
    environment:
      ConnectionStrings__OrdersDb: "Host=postgres;Port=5432;Database=${POSTGRES_ORDERS_DB:-orders};Username=${POSTGRES_USER:-orderflow};Password=${POSTGRES_PASSWORD:-orderflow}"
      RABBITMQ_HOST: ${RABBITMQ_HOST:-rabbitmq}
      RABBITMQ_PORT: ${RABBITMQ_PORT:-5672}
      RABBITMQ_USER: ${RABBITMQ_USER:-orderflow}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:-orderflow}
      OUTBOX_POLL_MS: ${OUTBOX_POLL_MS:-1000}
      RETRY_DELAY_MS: ${RETRY_DELAY_MS:-5000}
      MAX_DELIVERY_ATTEMPTS: ${MAX_DELIVERY_ATTEMPTS:-5}
      SEED_PATH: /app/seed/products.json
    ports:
      - "${API_PORT:-5080}:8080"
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  inventory-worker:
    build:
      context: .
      dockerfile: src/Inventory.Worker/Dockerfile
    environment:
      ConnectionStrings__InventoryDb: "Host=postgres;Port=5432;Database=${POSTGRES_INVENTORY_DB:-inventory};Username=${POSTGRES_USER:-orderflow};Password=${POSTGRES_PASSWORD:-orderflow}"
      RABBITMQ_HOST: ${RABBITMQ_HOST:-rabbitmq}
      RABBITMQ_PORT: ${RABBITMQ_PORT:-5672}
      RABBITMQ_USER: ${RABBITMQ_USER:-orderflow}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:-orderflow}
      OUTBOX_POLL_MS: ${OUTBOX_POLL_MS:-1000}
      RETRY_DELAY_MS: ${RETRY_DELAY_MS:-5000}
      MAX_DELIVERY_ATTEMPTS: ${MAX_DELIVERY_ATTEMPTS:-5}
      SEED_PATH: /app/seed/products.json
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  web:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    ports:
      - "${WEB_PORT:-8080}:80"
    depends_on:
      orders-api:
        condition: service_healthy

volumes:
  postgres_data:
